# 計算核心測試：改到 js/ 或測試檔時，用虛構的貸款確認房貸數字沒有跑掉
name: 計算測試
on:
  pull_request:
    paths: ['js/**', 'tools/**', 'index.html', '.github/workflows/test.yml']
  push:
    branches: [main]
    paths: ['js/**', 'tools/**', 'index.html', '.github/workflows/test.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/test/engine-test.mjs
      - run: python3 tools/test/rent_data_test.py
