# 租金行情：每月下載實價登錄租賃開放資料，整理成 data/rent/*.json 後提交（網頁的 🏘️ 租金行情會讀這些檔案）
# 第一次合併後可以到 Actions →「更新租金行情」→ Run workflow 手動跑一次
name: 更新租金行情
on:
  schedule:
    - cron: "17 2 6 * *"   # 每月 6 日 10:17（台灣時間）
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/fetch_rent.py', '.github/workflows/rent-data.yml']
permissions:
  contents: write
concurrency:
  group: rent-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/test/rent_data_test.py
      - run: python3 tools/fetch_rent.py --out data/rent
      - name: 提交更新的資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rent
          if git diff --cached --quiet; then echo "資料沒有變化"; else git commit -m "租金行情 $(date -u +%Y-%m-%d)" && git push; fi
